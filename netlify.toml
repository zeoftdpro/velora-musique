# Déploiement du site (apps/web) sur Netlify depuis le dépôt.
# À définir dans Netlify → Site configuration → Environment variables :
#   VITE_API_URL                adresse publique de l'API Velora (ex. https://velora-api.onrender.com)
#   VITE_DESKTOP_DOWNLOAD_URL   (optionnel) lien de l'installateur Windows, ex. une release GitHub
#   VITE_ANDROID_DOWNLOAD_URL   (optionnel) lien de l'appli Android (.apk), ex. la même release GitHub
[build]
  command = "npm run build -w apps/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  # L'appli Windows (apps/desktop) n'est pas construite ici : inutile de télécharger Electron (~100 Mo).
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"

# En-têtes de sécurité de toutes les pages.
# CSP : scripts du site et du lecteur YouTube uniquement. 'unsafe-inline' reste nécessaire pour les scripts : le
# badge que Netlify impose sur l'offre gratuite est une iframe srcdoc à scripts intégrés, soumise à la CSP de la page.
# Images et sons viennent de sources variées (Jamendo, YouTube, Supabase) : https: au sens large.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; font-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Fichiers de build aux noms hachés : cache navigateur d'un an.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le service worker doit toujours être revalidé pour que les mises à jour arrivent.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
