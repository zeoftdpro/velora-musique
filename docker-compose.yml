# Infrastructure locale de Velora : PostgreSQL, Meilisearch et un stockage objet compatible S3 (MinIO).
# Démarrage : `npm run infra:up`
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: velora
      POSTGRES_PASSWORD: velora
      POSTGRES_DB: velora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velora"]
      interval: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: velora-dev-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: velora
      MINIO_ROOT_PASSWORD: velora-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  # Crée le bucket et rend les pochettes publiques (les segments audio restent privés, servis par URL signée).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 velora velora-dev-secret &&
      mc mb --ignore-existing local/velora &&
      mc anonymous set download local/velora/covers &&
      echo 'bucket prêt'
      "

volumes:
  pgdata:
  meilidata:
  miniodata:
