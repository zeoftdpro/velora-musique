<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Velora</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; display: grid; place-items: center; text-align: center;
        font-family: 'Segoe UI', system-ui, sans-serif; color: #f4f4f6;
        background: radial-gradient(circle at 50% 0, #151a2b, #0b0b0f 70%);
      }
      .logo { width: 64px; height: 64px; margin: 0 auto 20px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #9a9aa6; margin: 0 0 24px; max-width: 360px; line-height: 1.5; }
      button {
        border: 0; border-radius: 99px; padding: 12px 28px; font: 700 14px inherit; cursor: pointer;
        background: #3b82f6; color: white;
      }
      button:hover { background: #2563eb; }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa" /><stop offset="1" stop-color="#2563eb" /></linearGradient></defs>
        <rect width="32" height="32" rx="9" fill="url(#g)" />
        <path d="M9 9.5l7 14 7-14" stroke="white" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1>Velora n’est pas joignable</h1>
      <p>Vérifiez votre connexion Internet. Nouvel essai automatique toutes les 10 secondes.</p>
      <button id="retry">Réessayer</button>
    </main>
    <script>
      const target = new URLSearchParams(location.search).get('url');
      const retry = () => { if (target) location.href = target; };
      document.getElementById('retry').addEventListener('click', retry);
      setTimeout(retry, 10000);
    </script>
  </body>
</html>
