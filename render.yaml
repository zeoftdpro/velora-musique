# Blueprint Render : serveur Velora (apps/api). Render → New → Blueprint → choisir ce dépôt.
# Les valeurs marquées « sync: false » sont demandées dans le tableau de bord à la création.
services:
  - type: web
    name: velora-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --workspace apps/api --include-workspace-root && npm run build -w apps/api
    # Les migrations s'appliquent à chaque démarrage (sans effet si la base est à jour).
    startCommand: node apps/api/dist/scripts/migrate.js && node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # L'appli Windows n'est pas construite sur le serveur : inutile de télécharger Electron.
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
      - key: DATABASE_URL # chaîne de connexion Supabase (Session pooler), comme dans ton .env
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://velora-musique.netlify.app
      # Adresses générées par l'API (flux HLS, fichiers signés, pochettes) : via le relais /api du site.
      # Même origine que la page : pas de CORS, et les flux restent accessibles depuis l'appli Windows.
      - key: PUBLIC_API_URL
        value: https://velora-musique.netlify.app/api
      - key: YOUTUBE_API_KEY
        sync: false
      - key: JAMENDO_CLIENT_ID
        sync: false
      - key: MEILI_HOST
        value: ""
      # Fichiers audio et pochettes : Supabase Storage (protocole S3), bucket privé « velora ».
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        value: https://xrepowedxmcmubruhywj.storage.supabase.co/storage/v1/s3
      - key: S3_REGION
        value: eu-west-1
      - key: S3_BUCKET
        value: velora
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_ACCESS_KEY_ID # clé d'accès S3 Supabase (Storage → S3 → Access keys)
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
